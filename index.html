<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b24">
  <title>Grammar Ghost Hunter</title>
  <style id="launcherStyles">
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080b24; color: white; font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; }
    #gameFrame { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; border: 0; margin: 0; background: #080b24; opacity: 0; }
    #status { transition: opacity .18s ease; position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 2147483647; display: grid; place-content: center; justify-items: center; gap: 1rem; background-color: #080b24; background-image: radial-gradient(ellipse at center, rgba(39,53,127,.25), rgba(4,4,20,.7)); background-size: cover; background-position: center; text-align: center; }
    #status::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 44%, transparent 25%, rgba(4,4,20,.24) 70%, rgba(1,2,12,.74)); }
    #status > * { position: relative; }
    .loading-orbit { width: 32px; height: 32px; border: 2px solid rgba(98,245,255,.18); border-top-color: #62f5ff; border-radius: 50%; box-shadow: 0 0 16px rgba(75,192,255,.2); animation: loadingOrbit 1.2s linear infinite; }
    @keyframes loadingOrbit { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .loading-orbit { animation: none; } }
    #loadingText { margin: 0; padding: 0 1rem; font-weight: 900; text-shadow: 0 0 16px #4bbdff; }
    #status [hidden] { display: none; }
    #status button { padding: .65rem 1.2rem; border: 1px solid #62f5ff; border-radius: 999px; background: #192b69; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div id="status" role="status" aria-label="Loading game"><span class="loading-orbit" aria-hidden="true"></span><p id="loadingText" hidden></p><button id="retry" hidden>TRY AGAIN</button></div>
  <script>
    // Keep this launcher stable: future game changes belong in game.html/assets.
    const retry = document.getElementById("retry");
    async function request(url, options, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.text();
      } finally { clearTimeout(timer); }
    }
    async function loadRelease() {
      retry.hidden = true;
      document.getElementById("loadingText").hidden = true;
      let release = `fallback-${Date.now()}`;
      const storageKey = `grammarGhostRelease:${location.pathname}`;
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved && /^[A-Za-z0-9._-]{1,100}$/.test(saved)) release = saved;
      } catch (_) {}
      try {
        const manifestUrl = new URL("release.json", document.baseURI);
        manifestUrl.searchParams.set("check", `${Date.now()}-${Math.random().toString(36).slice(2)}`);
        const manifest = JSON.parse(await request(manifestUrl.href, { cache: "no-store" }, 5000));
        if (typeof manifest.release !== "string" || !/^[A-Za-z0-9._-]{1,100}$/.test(manifest.release)) throw new Error("Invalid release ID");
        release = manifest.release;
        try { localStorage.setItem(storageKey, release); } catch (_) {}
      } catch (error) { console.warn("Release check unavailable; using fallback.", error); }
      try {
        const gameUrl = new URL("game.html", document.baseURI);
        gameUrl.searchParams.set("v", release);
        let html;
        try { html = await request(gameUrl.href, {}, 15000); }
        catch (_) {
          release = `fallback-${Date.now()}`;
          gameUrl.searchParams.set("v", release);
          html = await request(gameUrl.href, { cache: "no-store" }, 15000);
        }
        if (!html.includes('<html lang="en">')) throw new Error("Invalid game page");
        html = html.replace('<html lang="en">', `<html lang="en" data-release="${release}">`);
        // srcdoc keeps the permanent page and its cover mounted throughout startup.
        const base = new URL("./", document.baseURI).href.replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        html = html.replace('<base href="./">', `<base href="${base}">`);
        html = html.replace("<head>", '<head><style>html,body{margin:0;background:#080b24;}#loadingScreen p{visibility:hidden;}</style>');
        document.getElementById("gameFrame")?.remove();
        const frame = document.createElement("iframe");
        frame.id = "gameFrame";
        frame.title = "Tense Ghost Hunt";
        frame.setAttribute("allow", "autoplay");
        frame.setAttribute("aria-hidden", "true");
        frame.tabIndex = -1;
        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error("Game startup timed out")), 30000);
          frame.addEventListener("load", () => {
            waitForHome(frame).then(() => { clearTimeout(timeout); resolve(); }, error => { clearTimeout(timeout); reject(error); });
          }, { once: true });
          frame.srcdoc = html;
          document.body.append(frame);
        });
        frame.style.opacity = "1";
        frame.removeAttribute("aria-hidden");
        frame.removeAttribute("tabindex");
        const cover = document.getElementById("status");
        cover.style.pointerEvents = "none";
        cover.style.opacity = "0";
        setTimeout(() => cover.remove(), 200);
      } catch (error) {
        console.error("Game could not load.", error);
        document.getElementById("loadingText").textContent = "Please try again.";
        document.getElementById("loadingText").hidden = false;
        retry.hidden = false;
      }
    }
    async function waitForHome(frame) {
      const doc = frame.contentDocument;
      const view = frame.contentWindow;
      if (!doc || !view || !doc.getElementById("game")) throw new Error("Game page unavailable");
      await new Promise(resolve => {
        const observer = new MutationObserver(checkReady);
        function checkReady() {
          const loading = doc.getElementById("loadingScreen");
          const button = doc.querySelector(".mode-button");
          // Wait through the game's existing loading fade, behind the one cover.
          if (!button || button.disabled || loading) return;
          observer.disconnect();
          resolve();
        }
        observer.observe(doc.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "disabled"] });
        checkReady();
      });
      await Promise.all([...doc.querySelectorAll(".menu-ghost")].map(image => image.decode().catch(() => {})));
      if (doc.fonts) await doc.fonts.ready;
      await new Promise(resolve => view.requestAnimationFrame(() => view.requestAnimationFrame(resolve)));
      await new Promise(resolve => requestAnimationFrame(resolve));
    }
    retry.addEventListener("click", loadRelease);
    loadRelease();
  </script>
</body>
</html>
